name: GFNPresence
options:
  bundleIdPrefix: com.thehudek
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  GFNPresence:
    type: application
    platform: macOS
    sources:
      - GFNPresence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thehudek.gfnpresence
        PRODUCT_NAME: GFN Presence
        PRODUCT_MODULE_NAME: GFNPresence
        INFOPLIST_FILE: GFNPresence/Info.plist
        CODE_SIGN_ENTITLEMENTS: GFNPresence/GFNPresence.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Icon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_TESTABILITY: YES
    entitlements:
      path: GFNPresence/GFNPresence.entitlements
  GFNPresenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GFNPresenceTests
    dependencies:
      - target: GFNPresence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thehudek.gfnpresence.tests
        PRODUCT_MODULE_NAME: GFNPresenceTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GFN Presence.app/Contents/MacOS/GFN Presence"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GFNPresence:
    build:
      targets:
        GFNPresence: all
        GFNPresenceTests: [test]
    test:
      targets:
        - GFNPresenceTests
    run:
      config: Debug
